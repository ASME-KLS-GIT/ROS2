site_name: ROS2 — ASME KLS
site_description: Notes, tutorial links, experiments, examples, and projects related to ROS2.
repo_url: https://github.com/ASME-KLS-GIT/ROS2
repo_name: ASME-KLS-GIT/ROS2
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - search.suggest
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - examples
      check_paths: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Concepts:
      - Overview: concepts/index.md
      - Nodes & Topics: concepts/nodes-and-topics.md
  - Examples:
      - Overview: examples/index.md
      - "Publisher & Subscriber": examples/publisher-subscriber.md
  - API Cheat Sheet: api-cheatsheet/index.md
